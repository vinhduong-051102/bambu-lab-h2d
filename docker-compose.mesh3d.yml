# Mesh worker for "Thiết kế AI → Nhân vật" on the dashboard (see docs/cad.md): Hunyuan3D-2 shapes figures from
# pictures on the NVIDIA GPU, and Claude fixes and paints them in Blender (or models them from a description).
#   docker compose -f docker-compose.mesh3d.yml up -d --build
# Then in .env: MESH_WORKER_URL=http://127.0.0.1:3103
services:
  mesh3d:
    build: ./mesh3d
    image: bambu-lab-h2d/mesh3d:latest
    container_name: bambu-mesh3d
    restart: unless-stopped
    environment:
      - JOBS_DIR=/jobs
      - IMPORTS_DIR=/imports
      - ANALYSES_DIR=/analyses
      # Mechanism simulation (docs/mechanical-simulation.md): mechanisms, runs and their playback
      - SIM_DIR=/sim
      # Claude fixes, paints and makes the figures, on your Claude subscription
      - CLAUDE_CODE_OAUTH_TOKEN=${CLAUDE_CODE_OAUTH_TOKEN:-}
      - CLAUDE_CODE_OAUTH_TOKEN_FALLBACK=${CLAUDE_CODE_OAUTH_TOKEN_FALLBACK:-}
      # Optional Hugging Face read token: model downloads without one are rate limited and slow
      - HF_TOKEN=${HF_TOKEN:-}
      # Models leave the GPU after this many seconds without a job
      - MESH_IDLE_UNLOAD_S=${MESH_IDLE_UNLOAD_S:-600}
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      # Shared with the gateway and the CAD worker (CAD_JOBS_DIR): one folder per job
      - ./data/cad/jobs:/jobs
      # Hunyuan3D-2mini, Hunyuan3D-2mv, MV-Adapter with SDXL and the background remover (~25 GB), downloaded on
      # first use; MESH_MODELS_DIR puts them on a roomier drive
      - ${MESH_MODELS_DIR:-./data/mesh3d/models}:/models
      # The worker, and the CAD worker's preview renderer
      - ./mesh3d:/opt/mesh3d:ro
      - ./cad:/opt/cad:ro
      # "Thành phần của mẫu" (analyze.py): Studio's import folder, read only, and the renders of each analysis
      - ${STUDIO_IMPORT_DIR:-./data/studio/imports}:/imports:ro
      - ${MODEL_ANALYSIS_DIR:-./data/studio/analyses}:/analyses
      # Mechanism simulation: mechanisms/, runs/<sim id>/ (CSV, JSON, log, Blender playback), files/ (meshes)
      - ./data/sim:/sim
    ports:
      - "127.0.0.1:3103:8000"
    # Hunyuan3D-2 and MV-Adapter run on the GPU; Blender renders what Claude looks at with Cycles there too
    gpus: all
    # PyTorch's data loaders share memory between processes
    shm_size: "2gb"
    security_opt:
      - no-new-privileges:true
