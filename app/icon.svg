<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The header's logo mark (.logo-mark in globals.css): the blue tile with antd's AppstoreOutlined grid -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#tile)" />
  <g fill="none" stroke="#fff" stroke-width="4.5" stroke-linejoin="round">
    <rect x="15" y="15" width="14" height="14" rx="2.5" />
    <rect x="35" y="15" width="14" height="14" rx="2.5" />
    <rect x="15" y="35" width="14" height="14" rx="2.5" />
    <rect x="35" y="35" width="14" height="14" rx="2.5" />
  </g>
</svg>
