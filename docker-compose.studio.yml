# Bambu Studio streamed to the browser, embedded in the dashboard (see docs/studio.md).
#   docker compose -f docker-compose.studio.yml up -d
# Then in .env: STUDIO_URL=http://<this host>:3100/ and STUDIO_EXPORT_DIR=./data/studio/exports
services:
  bambustudio:
    image: lscr.io/linuxserver/bambustudio:latest
    container_name: bambu-studio
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
      - TITLE=Bambu Studio
      # Basic auth on the stream; strongly recommended when anyone else is on the network
      - CUSTOM_USER=${STUDIO_USER:-}
      - PASSWORD=${STUDIO_PASSWORD:-}
    volumes:
      # Studio's settings, presets and login survive restarts
      - ./data/studio/config:/config
      # Shared with the gateway (STUDIO_EXPORT_DIR): export sliced files here to print them from the dashboard
      - ./data/studio/exports:/exports
    ports:
      - "3100:3000"
    shm_size: "1gb"
    security_opt:
      - seccomp:unconfined
